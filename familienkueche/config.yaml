name: Familienküche
version: "0.26.3"
slug: familienkueche
description: Familienkalender, Erinnerungen, Aufgaben und Mealie-Anbindung
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-heart
panel_title: Familienküche
panel_admin: false
map:
  - type: homeassistant_config
    read_only: true
options:
  profile_name_1: "Person 1"
  profile_name_2: "Person 2"
  profile_name_3: "Person 3"
  google_calendar_edit_enabled: false
  google_calendar_edit_id: "primary"
  shopping_entity: "todo.shopping_list"
  birthdays_calendar: "calendar.birthdays"
  holidays_calendar: "calendar.holidays"
  vacations_calendar: ""
  weather_entity: "weather.pirateweather"
  tina_calendar: "calendar.person_1"
  joern_calendar: "calendar.person_2"
  waste_calendar: "calendar.waste"
  mealie_entry_id: ""
  mealie_image_base_url: ""
  meal_ai_offers_entity: "sensor.shop_offers"
  meal_ai_next_offers_entity: "sensor.shop_offers_next"
  meal_ai_offers_shop: "Aldi Nord"
  meal_ai_preferred_dishes: ""
  meal_ai_avoid: ""
  meal_ai_enabled: false
  meal_ai_model: "gpt-6-luna"
  meal_ai_monthly_budget_usd: 5
schema:
  parent_pin: password?
  profile_name_1: str?
  profile_name_2: str?
  profile_name_3: str?
  google_calendar_edit_enabled: bool?
  google_calendar_edit_id: str?
  shopping_entity: str?
  birthdays_calendar: str?
  holidays_calendar: str?
  vacations_calendar: str?
  weather_entity: str?
  tina_calendar: str?
  joern_calendar: str?
  waste_calendar: str?
  mealie_entry_id: str?
  mealie_image_base_url: str?
  meal_ai_offers_entity: str?
  meal_ai_next_offers_entity: str?
  meal_ai_offers_shop: list(Aldi Nord|Aldi Süd)?
  meal_ai_preferred_dishes: str?
  meal_ai_avoid: str?
  meal_ai_enabled: bool?
  meal_ai_model: list(gpt-6-luna|gpt-4.1-mini)?
  meal_ai_monthly_budget_usd: int(1,20)?
