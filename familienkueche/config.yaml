name: Familienküche
version: "0.20.0"
slug: familienkueche
description: Familienkalender, Erinnerungen, Aufgaben und Mealie-Anbindung
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-heart
panel_title: Familienküche
panel_admin: false
map:
  - type: homeassistant_config
    read_only: true
options:
  google_calendar_edit_enabled: false
  google_calendar_edit_id: "primary"
  shopping_entity: "todo.einkaufsliste"
  birthdays_calendar: "calendar.geburtstage_2"
  holidays_calendar: "calendar.feiertage_in_deutschland"
  weather_entity: "weather.home"
  tina_calendar: "calendar.tina"
  joern_calendar: "calendar.joern"
  waste_calendar: "calendar.muell"
  mealie_entry_id: ""
  mealie_image_base_url: "http://a0d7b954-mealie:9001"
  meal_ai_offers_entity: "sensor.aldi_nord_offers"
  meal_ai_next_offers_entity: "sensor.aldi_nord_offers_next"
  meal_ai_offers_shop: "Aldi Nord"
  meal_ai_preferred_dishes: "Nudeln, Eintöpfe, Pizza, Hähnchen"
  meal_ai_avoid: "Nüsse, Erdnüsse"
  meal_ai_enabled: false
  meal_ai_model: "gpt-6-luna"
  meal_ai_monthly_budget_usd: 5
schema:
  google_calendar_edit_enabled: bool?
  google_calendar_edit_id: str?
  shopping_entity: str?
  birthdays_calendar: str?
  holidays_calendar: str?
  weather_entity: str?
  tina_calendar: str?
  joern_calendar: str?
  waste_calendar: str?
  mealie_entry_id: str?
  mealie_image_base_url: url?
  meal_ai_offers_entity: str?
  meal_ai_next_offers_entity: str?
  meal_ai_offers_shop: list(Aldi Nord|Aldi Süd)?
  meal_ai_preferred_dishes: str?
  meal_ai_avoid: str?
  meal_ai_enabled: bool?
  meal_ai_model: list(gpt-6-luna|gpt-4.1-mini)?
  meal_ai_monthly_budget_usd: int(1,20)?
