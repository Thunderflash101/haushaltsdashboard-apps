name: Check app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56.1 does not support Ubuntu 26.04.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Python integration syntax
        run: python3 -m compileall -q custom_components
      - name: Callback bridge tests
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Repository privacy audit
        run: python3 tools/audit_repository.py
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser workflows and mobile layout
        run: |
          node tests/browser-smoke.mjs
          node tests/forecast-browser.mjs
          node tests/learning-browser.mjs
          HAUSHALT_TEST_HTTP=1 node tests/contracts-browser.mjs
          node tests/paypal-browser.mjs
          node tests/budget-browser.mjs
          node tests/flexible-browser.mjs
          node tests/contributions-browser.mjs
          node tests/theme-browser.mjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-browser-checks
          path: test-results/
          if-no-files-found: ignore
      - name: Container build
        run: docker build --tag haushaltsdashboard-test haushaltsdashboard
  familienkueche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Familienküche backend tests
        working-directory: familienkueche
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Familienküche frontend tests
        run: |
          npm install --no-save --package-lock=false jsdom@26.1.0
          for test in familienkueche/tests/*.cjs; do
            node "$test"
          done
      - name: Familienküche container build
        run: docker build --tag familienkueche-test familienkueche

